name: NUMPA web build

on:
  push:
    branches: [main, "mvp/**", "feature/**", "redesign/**"]
  pull_request:
    branches: [main, "mvp/**", "feature/**"]

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install dependencies
        run: npm install
      - name: Lint web application
        run: npm run lint
      - name: Run workspace model tests
        run: node --test app/components/workspace-data-model.test.mjs app/components/workspace-visualization-model.test.mjs app/components/workspace-ml-model.test.mjs app/components/workspace-settings-model.test.mjs
      - name: Build web application
        run: npm run build
