# Render Blueprint for the NUMPA FastAPI service.
# Set NUMPA_CORS_ORIGINS to the deployed Vercel origin in Render.
services:
  - type: web
    name: numpa-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NUMPA_CORS_ORIGINS
        sync: false
